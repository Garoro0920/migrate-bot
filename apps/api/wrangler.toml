# Cloudflare Workers 設定。Phase 2 後半でデプロイ時に値を埋める。
# operator は wrangler login → wrangler secret put GITHUB_WEBHOOK_SECRET
# を実行してから wrangler deploy する想定。
#
# 参考: https://developers.cloudflare.com/workers/wrangler/configuration/

name = "migrate-bot-api-dev"
main = "src/index.ts"
compatibility_date = "2026-04-26"
compatibility_flags = ["nodejs_compat"]

# 本番デプロイは別 environment にする (architecture.md §3.1: dev/prod 2 つ)。
# 今は dev のみ宣言。
[env.prod]
name = "migrate-bot-api-prod"

# D1 binding (architecture.md §5)。database_id は wrangler d1 create で確定後に埋める。
# 開発用と本番用を別 DB にする。
# [[d1_databases]]
# binding = "DB"
# database_name = "migrate-bot-dev"
# database_id = "<filled-after-wrangler-d1-create>"

# Cloudflare Queues binding (architecture.md §1.1)。
# 受信側 (このワーカー) は producer、別 worker が consumer になる。
# [[queues.producers]]
# binding = "JOBS_QUEUE"
# queue = "migrate-bot-jobs"

# 環境変数 (公開可)。
# [vars]

# Secrets (`wrangler secret put GITHUB_WEBHOOK_SECRET` で個別に設定):
# - GITHUB_WEBHOOK_SECRET
# - GITHUB_APP_ID
# - GITHUB_APP_PRIVATE_KEY
