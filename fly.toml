# fly.toml — migrate-bot-runner-dev (Fly.io Machines)
#
# このファイルが monorepo root にあるのは flyctl の制約による:
# - fly.toml 内の相対パス (dockerfile 等) は必ず fly.toml の dir 基準で解決される
# - build context も fly.toml の dir
# 結果、apps/runner/Dockerfile が COPY する monorepo 全体のファイルを context に
# 含めるには、fly.toml を root に置く必要がある。実体的なアプリは apps/runner/。
#
# 1 ジョブ = 1 マシン (architecture.md §1.2)。
# 起動は consumer Worker が Machines API 経由で行うため [http_service] は不要。
#
# Secrets (operator が flyctl secrets set で設定済):
# - ANTHROPIC_API_KEY
# - GITHUB_APP_ID
# - GITHUB_APP_PRIVATE_KEY
# - INTERNAL_API_TOKEN (apps/api /internal 認証共有秘密)
#
# Deploy:
#   - dev: `flyctl deploy --app migrate-bot-runner-dev --no-public-ips`
#   - prod: `node scripts/deploy-runner-and-update-image.mjs --env=prod`
#     (内部で `flyctl deploy --app migrate-bot-runner-prod` を呼ぶ。
#      app 名上書きにより本 fly.toml の app/region 値は無視される)
#
# ⚠ region 注意: prod app は flyctl apps create 時に region 未指定のため、
# Machines API から作成される machine は Fly のデフォルト (sjc) で起動する。
# 本 fly.toml の primary_region = 'nrt' は dev のみ反映される。
# prod machines を nrt に固定するため、apps/api/src/queue-consumer.ts の
# createMachine 呼出時に明示的に region: 'nrt' を渡している。
#
# See https://fly.io/docs/reference/configuration/

app = 'migrate-bot-runner-dev'
primary_region = 'nrt'

[build]
  dockerfile = 'apps/runner/Dockerfile'

[env]
  NODE_ENV = 'production'

[[vm]]
  # 512MB では next build (verify stage) が OOM kill されたので 2GB に拡張。
  # CPU も 2 にして build 時間を短縮。flyctl deploy が auto-launch する standby
  # machine もこの値で作られる (consumer Worker は queue-consumer.ts で個別指定)。
  size = 'shared-cpu-2x'
  memory = '2gb'
  cpus = 2
  memory_mb = 2048
